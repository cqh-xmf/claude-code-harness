  <circle cx="16" cy="16" r="4" fill="#0f172a" stroke="url(#fg)" stroke-width="1"/>
  <text x="16" y="16" text-anchor="middle" dominant-baseline="central" fill="url(#fg)" font-family="system-ui" font-size="5" font-weight="700">C</text>
